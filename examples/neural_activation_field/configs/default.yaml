neural_activation_field:
  window:
    width: 6
    height: 6
    depth: 3
  pattern: ripple
  iterations: 4
  aggregator:
    self: 0.55
    planar: 0.35
    vertical: 0.25
    bias: -0.12
  activation:
    bypass: true
  feedback:
    gain: 0.4
    damp: 0.1
  learning:
    rate: 0.12
    target: 0.35
  readout:
    edge: 0.6
    raw: 0.4
    bias: -0.1
    threshold: 0.3
  circuits:
    - neighbor_mix
    - activation_micro_lut
    - neuron_relu
