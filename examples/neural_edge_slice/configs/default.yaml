neural_edge_slice:
  # Logical execution window in cells (<= WIDTH/HEIGHT compiled into sand_defs.vh).
  window:
    width: 8
    height: 8

  # Synthetic pattern injected into the behavioural harness.
  # Choices: cross, ramp, checker, diag
  pattern: cross

  # Programmable gains expressed as floating-point ratios (converted to Q).
  gains:
    edge: 0.7
    raw: 0.3

  # Bias and threshold expressed in the same units as the gains.
  bias: -0.25
  threshold: 0.5

  # Reusable RTL primitives that the generated build should pull in.
  circuits:
    - edge_l1
    - neuron_relu
