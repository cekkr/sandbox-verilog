  \    reg [DATA_W-1:0] unit_backprop_lr_reg;\n    reg [DATA_W-1:0] unit_backprop_neigh_reg;\n\
  \    reg [DATA_W-1:0] unit_backprop_decay_reg;\n\n    // Dynamic window controls\n\
