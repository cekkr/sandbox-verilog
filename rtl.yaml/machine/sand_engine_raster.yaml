body_text: "// =============================================================================\n\
  // sand_engine_raster.v \u2014 single-ported raster update engine with pointer swap\n\
  // - Streams one cell at a time through a micro-coded ALU\n// - Designed to pair\
  \ with sand_jobmem2p (two-plane job memory)\n// - Provides activity and cycle metrics\
  \ for adaptive scheduling\n// =============================================================================\n\
  `include \"sand_defs.vh\"\n`include \"sand_math.vh\"\n\nmodule sand_engine_raster\
  \ #(\n    parameter DATA_W = `DATA_W,\n    parameter FRAC_W = `FRAC_W,\n    parameter\
  \ WIDTH  = `WIDTH,\n    parameter HEIGHT = `HEIGHT,\n    parameter N_JOBS = `N_JOBS,\n\
  \    parameter DEPTH  = `DEPTH,\n    parameter JOB_W  = (N_JOBS > 1) ? $clog2(N_JOBS)\
  \ : 1,\n    parameter LAYER_W= (DEPTH  > 1) ? $clog2(DEPTH)  : 1,\n    parameter\
  \ CELL_W = ((WIDTH*HEIGHT) > 1) ? $clog2(WIDTH*HEIGHT) : 1\n)(\n    input  wire\
  \                      clk,\n    input  wire                      rst,\n\n    //\
  \ Control\n    input  wire                      start_frame,   // pulse to start\
  \ one grid update\n    output reg                       busy,\n    output reg  \
  \                     frame_done,    // pulse when frame completes\n\n    // Config\
  \ (sampled on start_frame)\n    input  wire [`OPCODE_W-1:0]      opcode,\n    input\
  \  wire                      use_diagonals,\n    input  wire [DATA_W-1:0]      \
  \   constA,\n    input  wire [DATA_W-1:0]         constB,\n    input  wire [DATA_W-1:0]\
  \         constC,\n    input  wire [DATA_W-1:0]         constD,\n    input  wire\
  \ [DATA_W-1:0]         micro_lut [0:15],\n    input  wire                      micro_lut_we,\n\
  \    input  wire [3:0]                micro_lut_waddr,\n    input  wire [DATA_W-1:0]\
  \         micro_lut_wdata,\n\n    // Scheduler supplied context (sampled on start_frame)\n\
  \    input  wire [JOB_W-1:0]          job_id,\n    input  wire [LAYER_W-1:0]   \
  \     layer_id,\n    input  wire                      plane_read_sel,\n    input\
  \  wire                      unit_flux_enable,\n    input  wire                \
  \      unit_overflow_reverse_top,\n    input  wire                      unit_overflow_reverse_bottom,\n\
  \    input  wire                      unit_pressure_diag_override,\n    input  wire\
  \ [7:0]                unit_pressure_iters,\n    input  wire [DATA_W-1:0]      \
  \   unit_weight_top,\n    input  wire [DATA_W-1:0]         unit_weight_bottom,\n\
  \    input  wire [DATA_W-1:0]         unit_weight_side,\n    input  wire [DATA_W-1:0]\
  \         unit_weight_retain,\n    input  wire [DATA_W-1:0]         unit_weight_prev,\n\
  \    input  wire [DATA_W-1:0]         unit_flux_threshold,\n    input  wire [DATA_W-1:0]\
  \         unit_flux_reverse_top,\n    input  wire [DATA_W-1:0]         unit_flux_reverse_bottom,\n\
  \    input  wire [DATA_W-1:0]         unit_pressure_gain,\n    input  wire [DATA_W-1:0]\
  \         unit_backprop_lr,\n    input  wire [DATA_W-1:0]         unit_backprop_neigh,\n\
  \    input  wire [DATA_W-1:0]         unit_backprop_decay,\n    input  wire [15:0]\
  \               unit_window_width,\n    input  wire [15:0]               unit_window_height,\n\
  \    input  wire [15:0]               unit_window_x_offset,\n    input  wire [15:0]\
  \               unit_window_y_offset,\n\n    // Job memory interface (two-plane\
  \ BRAM wrapper)\n    output reg                       jm_we,\n    output reg  [JOB_W-1:0]\
  \          jm_job,\n    output reg  [LAYER_W-1:0]        jm_layer,\n    output reg\
  \                       jm_plane_sel,          // READ plane\n    output reg   \
  \                    jm_write_other_plane,  // assert when writing WRITE plane\n\
  \    output reg  [CELL_W-1:0]         jm_idx,\n    output reg  [DATA_W-1:0]    \
  \     jm_wdata,\n    input  wire [DATA_W-1:0]         jm_rdata,\n\n    // Telemetry\n\
  \    output reg  [31:0]               frame_activity,        // cells that changed\n\
  \    output reg  [31:0]               frame_cycles           // cycles spent between\
  \ start/done\n);\n    localparam integer CELLS = WIDTH*HEIGHT;\n    localparam integer\
  \ X_W   = (WIDTH  > 1) ? $clog2(WIDTH)  : 1;\n    localparam integer Y_W   = (HEIGHT\
  \ > 1) ? $clog2(HEIGHT) : 1;\n    localparam integer EXT_W = DATA_W + 4;\n\n   \
  \ // -------------------------------------------------------------------------\n\
  \    // Helper functions\n    // -------------------------------------------------------------------------\n\
  \    function integer clamp_int;\n        input integer v;\n        input integer\
  \ lo;\n        input integer hi;\n        begin\n            if (v < lo) clamp_int\
  \ = lo;\n            else if (v > hi) clamp_int = hi;\n            else clamp_int\
  \ = v;\n        end\n    endfunction\n\n    function [CELL_W-1:0] idx_from_xy;\n\
  \        input integer xi;\n        input integer yi;\n        begin\n         \
  \   idx_from_xy = yi*WIDTH + xi;\n        end\n    endfunction\n\n    function [DATA_W-1:0]\
  \ min2;\n        input [DATA_W-1:0] a, b;\n        begin\n            min2 = (a\
  \ < b) ? a : b;\n        end\n    endfunction\n\n    function [DATA_W-1:0] max2;\n\
  \        input [DATA_W-1:0] a, b;\n        begin\n            max2 = (a > b) ? a\
  \ : b;\n        end\n    endfunction\n\n    function automatic signed [EXT_W-1:0]\
  \ directional_flow;\n        input [DATA_W-1:0] self_val;\n        input [DATA_W-1:0]\
  \ neighbor_val;\n        input [DATA_W-1:0] channel_coeff;\n        input [DATA_W-1:0]\
  \ friction_coeff;\n        reg signed [EXT_W-1:0] self_ext;\n        reg signed\
  \ [EXT_W-1:0] neigh_ext;\n        reg signed [EXT_W-1:0] delta_ext;\n        reg\
  \ [EXT_W-1:0]       delta_abs_ext;\n        reg [DATA_W-1:0]      delta_abs_clamped;\n\
  \        reg [DATA_W-1:0]      delta_eff;\n        reg [DATA_W-1:0]      flow_mag;\n\
  \        reg [EXT_W-1:0]       flow_unsigned_ext;\n        reg signed [EXT_W-1:0]\
  \ flow_signed;\n    begin\n        self_ext  = {{(EXT_W-DATA_W){self_val[DATA_W-1]}},\
  \ self_val};\n        neigh_ext = {{(EXT_W-DATA_W){neighbor_val[DATA_W-1]}}, neighbor_val};\n\
  \        delta_ext = neigh_ext - self_ext;\n        delta_abs_ext = delta_ext[EXT_W-1]\
  \ ? -delta_ext : delta_ext;\n        delta_abs_clamped = (|delta_abs_ext[EXT_W-1:DATA_W])\n\
  \                            ? {DATA_W{1'b1}}\n                            : delta_abs_ext[DATA_W-1:0];\n\
  \        if (delta_abs_clamped <= friction_coeff) begin\n            flow_signed\
  \ = {EXT_W{1'b0}};\n        end else begin\n            delta_eff  = `FP_SUB(delta_abs_clamped,\
  \ friction_coeff, DATA_W);\n            flow_mag   = `FP_MUL_Q(delta_eff, channel_coeff,\
  \ FRAC_W);\n            flow_unsigned_ext = {{(EXT_W-DATA_W){1'b0}}, flow_mag};\n\
  \            flow_signed = delta_ext[EXT_W-1]\n                          ? -$signed(flow_unsigned_ext)\n\
  \                          :  $signed(flow_unsigned_ext);\n        end\n       \
  \ directional_flow = flow_signed;\n    end\n    endfunction\n\n    // -------------------------------------------------------------------------\n\
  \    // Internal state\n    // -------------------------------------------------------------------------\n\
  \    localparam S_IDLE  = 3'd0,\n               S_READ  = 3'd1,\n              \
  \ S_ALU   = 3'd2,\n               S_WRITE = 3'd3,\n               S_NEXT  = 3'd4,\n\
  \               S_DONE  = 3'd5,\n               S_ALU_PRESS = 3'd6;\n\n    reg [2:0]\
  \              st;\n    reg [X_W-1:0]          cur_x;\n    reg [Y_W-1:0]       \
  \   cur_y;\n    reg [3:0]              read_phase;\n    reg                    diag_active;\n\
  \n    // Sampled config\n    reg [`OPCODE_W-1:0]    opcode_reg;\n    reg [DATA_W-1:0]\
