  \   if (opcode_reg == `OP_PRESSURE) begin\n                        pressure_value\
  \     <= self_in;\n                        avg_tmp_reg        <= avg_tmp;\n    \
  \                    pressure_iters_rem <= (unit_pressure_iters_reg < 8'd1) ? 8'd1\n\
