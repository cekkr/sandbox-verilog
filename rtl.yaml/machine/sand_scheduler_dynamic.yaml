version: 1
kind: verilog_module
original_path: sand_scheduler_dynamic.v
includes:
- sand_defs.vh
modules:
- name: sand_scheduler_dynamic
  parameters:
  - name: DATA_W
    default: '16'
  - name: WIDTH
    default: '32'
  - name: HEIGHT
    default: '32'
  - name: DEPTH
    default: '4'
  - name: N_JOBS
    default: '4'
  ports:
    clk:
      direction: input
    rst:
      direction: input
    csr_we:
      direction: input
    csr_addr:
      direction: input
      width: '[7:0]'
    csr_wdata:
      direction: input
      width: '[31:0]'
    csr_re:
      direction: input
    csr_rdata:
      direction: output
      type: reg
      width: '[31:0]'
    seed_we:
      direction: input
    seed_job:
      direction: input
      width: '[((N_JOBS>1)?$clog2(N_JOBS):1)-1:0]'
    seed_layer:
      direction: input
      width: '[((DEPTH>1)?$clog2(DEPTH):1)-1:0]'
    seed_idx:
      direction: input
      width: '[((WIDTH*HEIGHT>1)?$clog2((WIDTH*HEIGHT)):1)-1:0]'
    seed_data:
      direction: input
      width: '[DATA_W-1:0]'
    job_done:
      direction: output
      type: reg
      width: '[N_JOBS-1:0]'
  signals:
  - name: opcode
    kind: reg
    width: '[5-1:0]'
  - name: constA
    kind: reg
    width: '[DATA_W-1:0]'
  - name: constB
    kind: reg
    width: '[DATA_W-1:0]'
  - name: constC
    kind: reg
    width: '[DATA_W-1:0]'
  - name: constD
    kind: reg
    width: '[DATA_W-1:0]'
  - name: force_diag
    kind: reg
  - name: use_micro
    kind: reg
  - name: micro_lut
    kind: reg
    width: '[DATA_W-1:0]'
    dimensions:
    - '[0:15]'
  - name: micro_lut_wr_stb
    kind: reg
  - name: micro_lut_wr_idx
    kind: reg
    width: '[3:0]'
  - name: micro_lut_wr_data
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_flux_enable
    kind: reg
  - name: unit_overflow_reverse_top
    kind: reg
  - name: unit_overflow_reverse_bottom
    kind: reg
  - name: unit_pressure_diag_override
    kind: reg
  - name: unit_pressure_iters
    kind: reg
    width: '[7:0]'
  - name: unit_weight_top
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_weight_bottom
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_weight_side
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_weight_retain
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_weight_prev
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_flux_threshold
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_flux_reverse_top
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_flux_reverse_bottom
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_pressure_gain
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_backprop_lr
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_backprop_neigh
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_backprop_decay
    kind: reg
    width: '[DATA_W-1:0]'
  - name: unit_window_width
    kind: reg
    width: '[15:0]'
    dimensions:
    - '[0:N_JOBS-1]'
  - name: unit_window_height
    kind: reg
    width: '[15:0]'
    dimensions:
    - '[0:N_JOBS-1]'
  - name: unit_window_xoff
    kind: reg
    width: '[15:0]'
    dimensions:
    - '[0:N_JOBS-1]'
  - name: unit_window_yoff
    kind: reg
    width: '[15:0]'
    dimensions:
    - '[0:N_JOBS-1]'
  - name: adapt_enable
    kind: reg
  - name: adapt_auto
    kind: reg
  - name: adapt_use_heavy
    kind: reg
  - name: adapt_manual_steps
    kind: reg
    width: '[7:0]'
  - name: adapt_min_steps
    kind: reg
    width: '[7:0]'
  - name: adapt_max_steps
    kind: reg
    width: '[7:0]'
  - name: adapt_thresh_lo
    kind: reg
    width: '[31:0]'
  - name: adapt_thresh_hi
    kind: reg
    width: '[31:0]'
  - name: adapt_cycle_limit
    kind: reg
    width: '[31:0]'
  - name: status_job_sel
    kind: reg
    width: '[JOB_W-1:0]'
  - name: step_budget
    kind: reg
    width: '[7:0]'
    dimensions:
    - '[0:N_JOBS-1]'
  - name: last_activity
    kind: reg
    width: '[31:0]'
    dimensions:
    - '[0:N_JOBS-1]'
  - name: last_cycles
    kind: reg
    width: '[31:0]'
    dimensions:
    - '[0:N_JOBS-1]'
  - name: plane_sel
    kind: reg
    width: '[DEPTH-1:0]'
    dimensions:
    - '[0:N_JOBS-1]'
  - name: jm_we_i
    kind: wire
  - name: jm_job_i
    kind: wire
    width: '[JOB_W-1:0]'
  - name: jm_layer_i
    kind: wire
    width: '[LAYER_W-1:0]'
  - name: jm_plane_sel_i
    kind: wire
  - name: jm_write_other_plane_i
    kind: wire
  - name: jm_idx_i
    kind: wire
    width: '[CELL_W-1:0]'
  - name: jm_wdata_i
    kind: wire
    width: '[DATA_W-1:0]'
  - name: jm_rdata_i
    kind: wire
    width: '[DATA_W-1:0]'
  - name: start_frame
    kind: reg
  - name: eng_busy
    kind: wire
  - name: eng_done
    kind: wire
  - name: eng_job_sel
    kind: reg
    width: '[JOB_W-1:0]'
  - name: eng_layer_sel
    kind: reg
    width: '[LAYER_W-1:0]'
  - name: eng_plane_sel
    kind: reg
  - name: eng_activity
    kind: wire
    width: '[31:0]'
  - name: eng_cycles
    kind: wire
    width: '[31:0]'
  - name: win_width_sel
    kind: reg
    width: '[15:0]'
  - name: win_height_sel
    kind: reg
    width: '[15:0]'
  - name: win_xoff_sel
    kind: reg
    width: '[15:0]'
  - name: win_yoff_sel
    kind: reg
    width: '[15:0]'
  - name: st
    kind: reg
    width: '[2:0]'
  - name: cur_job
    kind: reg
    width: '[JOB_W-1:0]'
  - name: cur_layer
    kind: reg
    width: '[LAYER_W-1:0]'
  - name: cur_budget
    kind: reg
    width: '[7:0]'
  - name: step_cnt
    kind: reg
    width: '[7:0]'
  - name: next_job
    kind: wire
    width: '[JOB_W-1:0]'
  - name: step_max_u8
    kind: wire
    width: '[7:0]'
  - name: heavy_opcode
    kind: wire
  - name: j
    kind: integer
  - name: l
    kind: integer
  - name: adapt_min_clamped
    kind: reg
    width: '[7:0]'
  - name: adapt_max_clamped
    kind: reg
    width: '[7:0]'
  - name: manual_clamped
    kind: reg
    width: '[7:0]'
  - name: act_hi
    kind: reg
    width: '[31:0]'
  - name: act_lo
    kind: reg
    width: '[31:0]'
  - name: budget_curr
    kind: reg
    width: '[7:0]'
  - name: budget_next
    kind: reg
    width: '[7:0]'
  - name: height_tmp
    kind: integer
  - name: idx
    kind: integer
  - name: manual_step
    kind: reg
    width: '[7:0]'
  - name: max_step
    kind: reg
    width: '[7:0]'
  - name: min_step
    kind: reg
    width: '[7:0]'
  - name: plane_next
    kind: reg
  - name: step_cnt_inc
    kind: reg
    width: '[7:0]'
  - name: tmp
    kind: integer
  - name: width_tmp
    kind: integer
  - name: x_tmp
    kind: integer
  - name: y_tmp
    kind: integer
  - name: engine_active
    kind: wire
  - name: status_idx
    kind: wire
    width: '[JOB_W-1:0]'
  - name: status_budget
    kind: wire
    width: '[7:0]'
  - name: status_activity
    kind: wire
    width: '[31:0]'
  - name: status_cycles
    kind: wire
    width: '[31:0]'
  constants:
  - name: CELLS
    value: WIDTH * HEIGHT
  - name: JOB_W
    value: '(N_JOBS > 1)? $clog2(N_JOBS) : 1'
  - name: LAYER_W
    value: '(DEPTH > 1)? $clog2(DEPTH) : 1'
  - name: CELL_W
    value: '(CELLS > 1)? $clog2(CELLS) : 1'
  - name: STEP_MAX
    value: '(8 > 0)? 8 : 1'
  - name: S_IDLE
    value: 3'd0
  - name: S_WAIT
    value: 3'd1
  - name: S_NEXTJ
    value: 3'd2
  - name: S_NEXTL
    value: 3'd3
  always_blocks:
  - 'on':
    - posedge clk
    type: sequential
    body:
    - if: rst
      then:
      - opcode <= 5'd8;
      - constA <= { 1{ 1'b0 } };
      - constB <= { 1{ 1'b0 } };
      - constC <= { 1{ 1'b0 } };
      - constD <= { 1{ 1'b0 } };
      - force_diag <= 1 != 0;
      - use_micro <= 1'b0;
      - adapt_enable <= 1'b0;
      - adapt_auto <= 1'b1;
      - adapt_use_heavy <= 1'b1;
      - unit_flux_enable <= 1'b0;
      - unit_overflow_reverse_top <= 1'b0;
      - unit_overflow_reverse_bottom <= 1'b0;
      - unit_pressure_diag_override <= 1'b0;
      - unit_pressure_iters <= 8'd1;
      - unit_weight_top <= { 1{ 1'b0 } };
      - unit_weight_bottom <= { 1{ 1'b0 } };
      - unit_weight_side <= { 1{ 1'b0 } };
      - unit_weight_retain <= { 1{ 1'b0 } };
      - unit_weight_prev <= { 1{ 1'b0 } };
      - unit_flux_threshold <= { 1{ 1'b1 } };
      - unit_flux_reverse_top <= { 1{ 1'b0 } };
      - unit_flux_reverse_bottom <= { 1{ 1'b0 } };
      - unit_pressure_gain <= { 1{ 1'b0 } };
      - unit_backprop_lr <= { 1{ 1'b0 } };
      - unit_backprop_neigh <= { 1{ 1'b0 } };
      - unit_backprop_decay <= { 1{ 1'b0 } };
      - adapt_manual_steps <= clamp_steps(8);
      - adapt_min_steps <= clamp_steps(1);
      - adapt_max_steps <= clamp_steps(8);
      - adapt_thresh_lo <= 16;
      - 'adapt_thresh_hi <= (32 * 32 > 0)? 32 * 32 >> 1 : 1;'
      - adapt_cycle_limit <= 0;
      - status_job_sel <= { 1{ 1'b0 } };
      - micro_lut_wr_stb <= 1'b0;
      - micro_lut_wr_idx <= 4'd0;
      - micro_lut_wr_data <= { 1{ 1'b0 } };
      - for(j=0; j<16; j=j+1) micro_lut[j] <= { 1{ 1'b0 } };
      - "for(j=0; j<N_JOBS; j=j+1) begin\n  step_budget[j] <= clamp_steps(8);\n  last_activity[j]\
        \ <= 32'd0;\n  last_cycles[j] <= 32'd0;\n  unit_window_width[j] <= WIDTH;\n\
        \  unit_window_height[j] <= HEIGHT;\n  unit_window_xoff[j] <= 16'd0;\n  unit_window_yoff[j]\
        \ <= 16'd0;\n  for(l=0; l<DEPTH; l=l+1) plane_sel[j][l] <= 1'b0;\nend"
      - st <= S_IDLE;
      - cur_job <= { 1{ 1'b0 } };
      - cur_layer <= { 1{ 1'b0 } };
      - cur_budget <= clamp_steps(8);
      - step_cnt <= 8'd0;
      - start_frame <= 1'b0;
      - job_done <= { 1{ 1'b0 } };
      - eng_job_sel <= { 1{ 1'b0 } };
      - eng_layer_sel <= { 1{ 1'b0 } };
      - eng_plane_sel <= 1'b0;
      - win_width_sel <= WIDTH;
      - win_height_sel <= HEIGHT;
      - win_xoff_sel <= 16'd0;
      - win_yoff_sel <= 16'd0;
      else:
      - start_frame <= 1'b0;
      - micro_lut_wr_stb <= 1'b0;
      - if: csr_we
        then:
        - case: csr_addr
          branches:
            8'h00:
            - status_job_sel <= csr_wdata[JOB_W-1:0];
            8'h04:
            - opcode <= csr_wdata[5-1:0];
            8'h08:
            - constA <= csr_wdata[DATA_W-1:0];
            8'h0C:
            - constB <= csr_wdata[DATA_W-1:0];
            8'h34:
            - constC <= csr_wdata[DATA_W-1:0];
            8'h38:
            - constD <= csr_wdata[DATA_W-1:0];
            8'h10:
            - force_diag <= csr_wdata[0];
            - use_micro <= csr_wdata[1];
            8'h14:
            - job_done <= job_done & ~csr_wdata[N_JOBS-1:0];
            8'h18:
            - adapt_enable <= csr_wdata[0];
            - adapt_auto <= csr_wdata[1];
            - adapt_use_heavy <= csr_wdata[2];
            - manual_clamped <= clamp_steps({ 8'd0, (csr_wdata >> 3) & 8'hFF });
            - adapt_min_clamped <= clamp_steps({ 8'd0, (csr_wdata >> 11) & 8'hFF });
            - adapt_max_clamped <= clamp_steps({ 8'd0, (csr_wdata >> 19) & 8'hFF });
            - if: (adapt_max_clamped < adapt_min_clamped)
              then:
              - adapt_max_clamped <= adapt_min_clamped;
            - adapt_manual_steps <= manual_clamped;
            - adapt_min_steps <= adapt_min_clamped;
            - adapt_max_steps <= adapt_max_clamped;
            8'h1C:
            - adapt_thresh_lo <= csr_wdata;
            8'h20:
            - adapt_thresh_hi <= csr_wdata;
            8'h24:
            - adapt_cycle_limit <= csr_wdata;
            8'h2C:
            - status_job_sel <= csr_wdata[JOB_W-1:0];
            8'h50:
            - unit_flux_enable <= csr_wdata[0];
            - unit_overflow_reverse_top <= csr_wdata[1];
            - unit_overflow_reverse_bottom <= csr_wdata[2];
            - unit_pressure_diag_override <= csr_wdata[3];
            - if: (csr_wdata[15:8] == 8'd0)
              then:
              - unit_pressure_iters <= 8'd1;
              else:
              - if: (csr_wdata[15:8] > 8'd32)
                then:
                - unit_pressure_iters <= 8'd32;
                else:
                - unit_pressure_iters <= csr_wdata[15:8];
            8'h54:
            - idx = status_job_sel;
            - if: (idx < N_JOBS)
              then:
              - width_tmp = csr_wdata[15:0];
              - height_tmp = csr_wdata[31:16];
              - if: (width_tmp == 0)
                then:
                - width_tmp = WIDTH;
              - if: (height_tmp == 0)
                then:
                - height_tmp = HEIGHT;
              - if: (width_tmp < 1)
                then:
                - width_tmp = 1;
              - if: (height_tmp < 1)
                then:
                - height_tmp = 1;
              - if: (width_tmp > WIDTH)
                then:
                - width_tmp = WIDTH;
              - if: (height_tmp > HEIGHT)
                then:
                - height_tmp = HEIGHT;
              - x_tmp = unit_window_xoff[idx];
              - y_tmp = unit_window_yoff[idx];
              - if: (x_tmp + width_tmp > WIDTH)
                then:
                - width_tmp = WIDTH - x_tmp;
              - if: (y_tmp + height_tmp > HEIGHT)
                then:
                - height_tmp = HEIGHT - y_tmp;
              - if: (width_tmp < 1)
                then:
                - width_tmp = 1;
              - if: (height_tmp < 1)
                then:
                - height_tmp = 1;
              - unit_window_width[idx] <= width_tmp[15:0];
              - unit_window_height[idx] <= height_tmp[15:0];
            8'h58:
            - idx = status_job_sel;
            - if: (idx < N_JOBS)
              then:
              - x_tmp = csr_wdata[15:0];
              - y_tmp = csr_wdata[31:16];
              - if: (x_tmp < 0)
                then:
                - x_tmp = 0;
              - if: (y_tmp < 0)
                then:
                - y_tmp = 0;
              - if: (x_tmp >= WIDTH)
                then:
                - x_tmp = WIDTH - 1;
              - if: (y_tmp >= HEIGHT)
                then:
                - y_tmp = HEIGHT - 1;
              - width_tmp = unit_window_width[idx];
              - height_tmp = unit_window_height[idx];
              - if: (x_tmp + width_tmp > WIDTH)
                then:
                - width_tmp = WIDTH - x_tmp;
                - if: (width_tmp < 1)
                  then:
                  - width_tmp = 1;
              - if: (y_tmp + height_tmp > HEIGHT)
                then:
                - height_tmp = HEIGHT - y_tmp;
                - if: (height_tmp < 1)
                  then:
                  - height_tmp = 1;
              - unit_window_xoff[idx] <= x_tmp[15:0];
              - unit_window_yoff[idx] <= y_tmp[15:0];
              - unit_window_width[idx] <= width_tmp[15:0];
              - unit_window_height[idx] <= height_tmp[15:0];
            8'h5C:
            - unit_weight_top <= csr_wdata[DATA_W-1:0];
            8'h60:
            - unit_weight_bottom <= csr_wdata[DATA_W-1:0];
            8'h64:
            - unit_weight_side <= csr_wdata[DATA_W-1:0];
            8'h68:
            - unit_weight_retain <= csr_wdata[DATA_W-1:0];
            8'h6C:
            - unit_weight_prev <= csr_wdata[DATA_W-1:0];
            8'h70:
            - unit_flux_threshold <= csr_wdata[DATA_W-1:0];
            8'h74:
            - unit_flux_reverse_top <= csr_wdata[DATA_W-1:0];
            8'h78:
            - unit_flux_reverse_bottom <= csr_wdata[DATA_W-1:0];
            8'h7C:
            - unit_pressure_gain <= csr_wdata[DATA_W-1:0];
            8'h80:
            - unit_backprop_lr <= csr_wdata[DATA_W-1:0];
            8'h84:
            - unit_backprop_neigh <= csr_wdata[DATA_W-1:0];
            8'h88:
            - unit_backprop_decay <= csr_wdata[DATA_W-1:0];
          default:
          - if: ((csr_addr >= 8'h40) && (csr_addr < 8'h40 + 16))
            then:
            - micro_lut[csr_addr - 8'h40] <= csr_wdata[DATA_W-1:0];
            - micro_lut_wr_stb <= 1'b1;
            - micro_lut_wr_idx <= csr_addr - 8'h40;
            - micro_lut_wr_data <= csr_wdata[DATA_W-1:0];
      - case: st
        branches:
          S_IDLE:
          - cur_budget <= step_budget[cur_job];
          - eng_job_sel <= cur_job;
          - eng_layer_sel <= cur_layer;
          - eng_plane_sel <= plane_sel[cur_job][cur_layer];
          - win_width_sel <= unit_window_width[cur_job];
          - win_height_sel <= unit_window_height[cur_job];
          - win_xoff_sel <= unit_window_xoff[cur_job];
          - win_yoff_sel <= unit_window_yoff[cur_job];
          - start_frame <= 1'b1;
          - st <= S_WAIT;
          S_WAIT:
          - if: eng_done
            then:
            - plane_next = plane_sel[cur_job][cur_layer] ^ 1'b1;
            - plane_sel[cur_job][cur_layer] <= plane_next;
            - last_activity[cur_job] <= eng_activity;
            - last_cycles[cur_job] <= eng_cycles;
            - budget_curr = step_budget[cur_job];
            - min_step <= adapt_min_steps;
            - max_step <= adapt_max_steps;
            - manual_step <= adapt_manual_steps;
            - if: (min_step < 1)
              then:
              - min_step = 1;
            - if: (max_step < min_step)
              then:
              - max_step = min_step;
            - if: (max_step > step_max_u8)
              then:
              - max_step = step_max_u8;
            - if: (manual_step < 1)
              then:
              - manual_step = 8'd1;
            - if: (manual_step > step_max_u8)
              then:
              - manual_step = step_max_u8;
            - act_lo = adapt_thresh_lo;
            - 'act_hi = (adapt_thresh_hi < adapt_thresh_lo)? adapt_thresh_lo : adapt_thresh_hi;'
            - if: (!adapt_enable)
              then:
              - budget_next = step_max_u8;
              else:
              - if: (!adapt_auto)
                then:
                - budget_next = manual_step;
                else:
                - budget_next = budget_curr;
                - if: ((adapt_cycle_limit != 32'd0) && (eng_cycles > adapt_cycle_limit)
                    && (budget_next > min_step))
                  then:
                  - budget_next = budget_next - 1'b1;
                  else:
                  - if: ((eng_activity > act_hi) && (budget_next < max_step))
                    then:
                    - budget_next = budget_next + 1'b1;
                    else:
                    - if: ((eng_activity < act_lo) && (budget_next > min_step))
                      then:
                      - budget_next = budget_next - 1'b1;
                - if: (adapt_use_heavy && heavy_opcode && (budget_next > min_step))
                  then:
                  - budget_next = budget_next - 1'b1;
            - if: (budget_next < 8'd1)
              then:
              - budget_next = 8'd1;
            - if: (budget_next > step_max_u8)
              then:
              - budget_next = step_max_u8;
            - step_budget[cur_job] <= budget_next;
            - cur_budget <= budget_next;
            - step_cnt_inc = step_cnt + 1'b1;
            - if: (step_cnt_inc < budget_next)
              then:
              - step_cnt <= step_cnt_inc;
              - st <= S_IDLE;
              else:
              - step_cnt <= 8'd0;
              - if: (cur_layer == DEPTH - 1)
                then:
                - job_done[cur_job] <= 1'b1;
                - cur_layer <= { 1{ 1'b0 } };
                - cur_job <= next_job;
                - st <= S_NEXTJ;
                else:
                - cur_layer <= cur_layer + 1'b1;
                - st <= S_NEXTL;
          S_NEXTL:
          - st <= S_IDLE;
          S_NEXTJ:
          - st <= S_IDLE;
  - 'on':
    - '*'
    type: combinational
    body:
    - csr_rdata = 32'h0;
    - if: csr_re
      then:
      - case: csr_addr
        branches:
          8'h14:
          - csr_rdata = { { 1{ 1'b0 } }, job_done, engine_active };
          8'h28:
          - csr_rdata = { status_cycles[15:0], status_activity[15:0] };
          8'h30:
          - csr_rdata = { adapt_max_steps, adapt_min_steps, status_budget, adapt_manual_steps
            };
