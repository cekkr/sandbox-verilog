version: 1
kind: sand_header
header: sand_defs
original_path: sand_defs.vh
tags:
- parameters
- csr
guard: SAND_DEFS_VH
defines:
- name: SAND_DEFS_VH
  value: ''
- name: DATA_W
  value: 16      // cell data width (fixed-point ok)
- name: FRAC_W
  value: 8       // if using fixed-point (Q8.8 by default)
- name: WIDTH
  value: 32      // grid X (edit as resources allow)
- name: HEIGHT
  value: 32      // grid Y
- name: DEPTH
  value: 4       // grid Z (layers); set 1 for pure 2D
- name: N_JOBS
  value: 4       // number of sandboxes time-sliced
- name: STEPS_PER_SLICE
  value: 8       // steps per job before rotating
- name: USE_DIAGONALS
  value: '1       // 1: 8-neighborhood, 0: 4-neighborhood'
- name: CSR_ADDR_W
  value: '8'
- name: CSR_JOB_SELECT
  value: '8''h00   // W: selects active job when manually poked'
- name: CSR_RULE_OP
  value: '8''h04   // W: opcode selector (see opcodes below)'
- name: CSR_RULE_CONSTA
  value: '8''h08   // W: constA (DATA_W)'
- name: CSR_RULE_CONSTB
  value: '8''h0C   // W: constB (DATA_W)'
- name: CSR_FLAGS
  value: '8''h10   // W: [0]=enable_diagonals override, [1]=use_microcode'
- name: CSR_STATUS
  value: '8''h14   // R: [0]=engine_busy, [N_JOBS:1]=job_done bits'
- name: CSR_ADAPT_CTRL
  value: '8''h18   // W: [0]=enable, [1]=auto, step budgets packed'
- name: CSR_ADAPT_THRESH_LO
  value: '8''h1C   // W: activity threshold low'
- name: CSR_ADAPT_THRESH_HI
  value: '8''h20   // W: activity threshold high'
- name: CSR_ADAPT_CAPACITY
  value: '8''h24   // W: cycle budget hint for frame runtime (0=ignore)'
- name: CSR_ADAPT_STATUS
  value: '8''h28   // R: packed status for selected job'
- name: CSR_ADAPT_STATUS_SEL
  value: '8''h2C   // W: selects which job to expose via STATUS register'
- name: CSR_ADAPT_BUDGET
  value: '8''h30   // R: step budget + misc info for selected job'
- name: CSR_RULE_CONSTC
  value: '8''h34   // W: constC / mix coefficient C'
- name: CSR_RULE_CONSTD
  value: '8''h38   // W: constD / mix bias term'
- name: CSR_MICRO_BASE
  value: '8''h40   // W: microcode table (16 entries)'
- name: CSR_UNIT_CTRL
  value: '8''h50   // W: unit behavior enable bits + iteration counts'
- name: CSR_UNIT_WINDOW_WH
  value: '8''h54   // W: {height[31:16], width[15:0]} for selected job'
- name: CSR_UNIT_WINDOW_OFFSET
  value: '8''h58   // W: {y_off[31:16], x_off[15:0]} for selected job'
- name: CSR_UNIT_FLUX_WEIGHT_TOP
  value: '8''h5C   // W: weight for north/top flux'
- name: CSR_UNIT_FLUX_WEIGHT_BOTTOM
  value: '8''h60  // W: weight for south/bottom flux'
- name: CSR_UNIT_FLUX_WEIGHT_SIDE
  value: '8''h64   // W: weight for lateral/diagonal flux'
- name: CSR_UNIT_FLUX_WEIGHT_RETAIN
  value: '8''h68  // W: retention/self weight'
- name: CSR_UNIT_FLUX_WEIGHT_PREV
  value: '8''h6C   // W: previous-layer feedback weight'
- name: CSR_UNIT_FLUX_THRESHOLD
  value: '8''h70   // W: saturation threshold for flux accumulator'
- name: CSR_UNIT_FLUX_REVERSE_TOP
  value: '8''h74   // W: fraction of overflow sent back upward'
- name: CSR_UNIT_FLUX_REVERSE_BOTTOM
  value: '8''h78 // W: fraction of overflow drained downward'
- name: CSR_UNIT_PRESSURE_GAIN
  value: '8''h7C   // W: exchange rate gain'
- name: CSR_UNIT_BACKPROP_LR
  value: '8''h80   // W: learning rate for backprop mode'
- name: CSR_UNIT_BACKPROP_NEIGH
  value: '8''h84   // W: neighbor-coupled gradient gain'
- name: CSR_UNIT_BACKPROP_DECAY
  value: '8''h88   // W: decay/regularization factor'
- name: CSR_UNIT_STATUS_WINDOW
  value: '8''h8C   // R: {height[31:16], width[15:0]} for selected job'
- name: CSR_UNIT_STATUS_OFFSET
  value: '8''h90   // R: {y_off[31:16], x_off[15:0]} for selected job'
- name: ADAPT_DEFAULT_MANUAL_STEPS
  value: '`STEPS_PER_SLICE'
- name: ADAPT_DEFAULT_MIN_STEPS
  value: '1'
- name: ADAPT_DEFAULT_MAX_STEPS
  value: '`STEPS_PER_SLICE'
- name: ADAPT_DEFAULT_LOW_THRESH
  value: '16'
- name: ADAPT_DEFAULT_HIGH_THRESH
  value: '(((`WIDTH*`HEIGHT) > 0) ? ((`WIDTH*`HEIGHT) >> 1) : 1)'
- name: ADAPT_DEFAULT_CAP_CYCLES
  value: '0'
- name: OPCODE_W
  value: '5'
- name: OP_NOP
  value: 5'd0
- name: OP_SELF
  value: 5'd1
- name: OP_SUM_NBRS
  value: 5'd2
- name: OP_AVG_NBRS
  value: 5'd3
- name: OP_ADD_CONST
  value: 5'd4
- name: OP_SUB_CONST
  value: 5'd5
- name: OP_MUL_CONST
  value: 5'd6
- name: OP_DIV_CONST
  value: 5'd7
- name: OP_DIFFUSION
  value: 5'd8  // self + k*(avg_nbrs - self)
- name: OP_MIN
  value: 5'd9  // min(self, any neighbor)
- name: OP_MAX
  value: 5'd10 // max(self, any neighbor)
- name: OP_CLAMP
  value: 5'd11 // clamp(self, constA..constB)
- name: OP_WATER_FLUX
  value: 5'd12 // weighted flux accumulation with overflow routing
- name: OP_PRESSURE
  value: 5'd13 // iterative pressure/exchange solver
- name: OP_BACKPROP
  value: 5'd14 // simple backprop-style gradient update
- name: OP_MICRO
  value: 5'd15 // microcode lookup (default)
- name: OP_LAPLACIAN
  value: 5'd16 // 6-neighbor laplacian (planar + vertical)
- name: OP_SHARPEN
  value: 5'd17 // self + alpha*(laplacian) with alpha=constA
- name: OP_EDGE
  value: 5'd18 // |dx|+|dy| using 4-neighbor gradients
- name: OP_MIX
  value: 5'd19 // a*self + b*avg + c*sum + d (fixed-point mix)
notes:
  overview: Global configuration header for the sand engine.
  items:
  - Holds global parameters for grid geometry, opcodes, and CSR layout.
  - Wraps the file in SAND_DEFS_VH guard to avoid double inclusion.
implementation:
  machine_path: machine/sand_defs.yaml
  kind: verilog_header
