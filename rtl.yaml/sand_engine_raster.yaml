behaviour:
  overview: Streams the grid through a single-port pipeline, gathers telemetry, and
    handles optional pressure iterations/windowing.
  notes:
  - Consumes scheduler-provided window bounds, unit tuples, and micro-LUT writes.
  - Exposes frame activity/cycle counters for adaptive scheduling.
