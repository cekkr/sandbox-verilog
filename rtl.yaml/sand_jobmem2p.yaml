version: 1
kind: sand_module
module: sand_jobmem2p
original_path: sand_jobmem2p.v
includes:
- sand_defs.vh
tags:
- memory
- dual-plane
interface:
  parameters:
  - name: DATA_W
    default: '16'
    signed: false
  - name: WIDTH
    default: '32'
    signed: false
  - name: HEIGHT
    default: '32'
    signed: false
  - name: DEPTH
    default: '4'
    signed: false
  - name: N_JOBS
    default: '4'
    signed: false
  ports:
  - name: clk
    direction: input
    datatype: wire
    signed: false
  - name: seed_we
    direction: input
    datatype: wire
    signed: false
  - name: seed_job
    direction: input
    datatype: wire
    width: '[((N_JOBS>1)?$clog2(N_JOBS):1)-1:0]'
    signed: false
  - name: seed_layer
    direction: input
    datatype: wire
    width: '[((DEPTH>1)?$clog2(DEPTH):1)-1:0]'
    signed: false
  - name: seed_plane
    direction: input
    datatype: wire
    signed: false
  - name: seed_idx
    direction: input
    datatype: wire
    width: '[((WIDTH*HEIGHT>1)?$clog2((WIDTH*HEIGHT)):1)-1:0]'
    signed: false
  - name: seed_data
    direction: input
    datatype: wire
    width: '[DATA_W-1:0]'
    signed: false
  - name: eng_we
    direction: input
    datatype: wire
    signed: false
  - name: eng_job
    direction: input
    datatype: wire
    width: '[((N_JOBS>1)?$clog2(N_JOBS):1)-1:0]'
    signed: false
  - name: eng_layer
    direction: input
    datatype: wire
    width: '[((DEPTH>1)?$clog2(DEPTH):1)-1:0]'
    signed: false
  - name: eng_plane_sel
    direction: input
    datatype: wire
    signed: false
  - name: eng_write_other_plane
    direction: input
    datatype: wire
    signed: false
  - name: eng_idx
    direction: input
    datatype: wire
    width: '[((WIDTH*HEIGHT>1)?$clog2((WIDTH*HEIGHT)):1)-1:0]'
    signed: false
  - name: eng_wdata
    direction: input
    datatype: wire
    width: '[DATA_W-1:0]'
    signed: false
  - name: eng_rdata
    direction: output
    datatype: wire
    width: '[DATA_W-1:0]'
    signed: false
behaviour:
  overview: True dual-plane job memory wrapper providing independent read/write planes
    with pointer swaps.
  notes:
  - Abstracts address generation across job, layer, plane, and cell dimensions.
  - Pairs with bram_tdp_wrap for vendor-specific RAM inference.
implementation:
  machine_path: machine/sand_jobmem2p.v
  kind: verilog_module
