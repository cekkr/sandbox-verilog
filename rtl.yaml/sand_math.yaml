version: 1
kind: sand_header
header: sand_math
original_path: sand_math.vh
tags:
- math
- fixed-point
guard: SAND_MATH_VH
defines:
- name: SAND_MATH_VH
  value: ''
- name: SATURATE
  value: '1       // 1: clamp on overflow, 0: wrap'
- name: ROUND_MUL
  value: '1      // 1: round on >> FRAC_W, 0: truncate'
- name: _MAXW(DATA_W)
  value: '{DATA_W{1''b1}}'
- name: _MINW(DATA_W)
  value: '{DATA_W{1''b0}}'
- name: SAT_ADD(a,b,DATA_W)
  value: \
- name: SAT_SUB(a,b,DATA_W)
  value: \
- name: FP_MUL_Q(a,c,FRAC_W)
  value: \
- name: FP_DIV_Q(a,c,FRAC_W)
  value: \
- name: FP_ADD(a,b,DATA_W)
  value: '( `SATURATE ? `SAT_ADD((a),(b),DATA_W) : ((a)+(b)) )'
- name: FP_SUB(a,b,DATA_W)
  value: '( `SATURATE ? `SAT_SUB((a),(b),DATA_W) : ((a)-(b)) )'
notes:
  overview: Shared fixed-point math helper macros.
  items:
  - Defines saturating add/sub macros and fixed-point multiply/divide helpers.
  - Controlled by SATURATE and ROUND_MUL toggles for wrap vs clamp behaviour.
implementation:
  machine_path: machine/sand_math.yaml
  kind: verilog_header
