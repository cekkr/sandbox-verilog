  \ flow_mag};\n        end\n        directional_flow = flow_signed;\n    end\n  \
  \  endfunction\n\n    // Sum / Average of neighbors (4 or 8)\n    reg [DATA_W+3:0]\
  \ sum_nbrs;   // headroom\n    reg [DATA_W-1:0] avg_nbrs;\n    reg [DATA_W-1:0]\
  \ min_nbr, max_nbr;\n    reg [DATA_W+2:0] sum4_only;\n\n    wire [DATA_W-1:0] nb4\
  \ [0:3];\n    assign nb4[0]=n_in; assign nb4[1]=s_in; assign nb4[2]=e_in; assign\
