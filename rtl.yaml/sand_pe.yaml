  \ gain_sel;\n                reg [DATA_W-1:0] delta_val;\n                reg [DATA_W-1:0]\
  \ pressure_val;\n                gain_sel = (unit_pressure_gain != {DATA_W{1'b0}})\
  \ ? unit_pressure_gain : constA;\n                iter_limit = (unit_pressure_iters\
  \ < 8'd1) ? 8'd1 :\n                             (unit_pressure_iters > 8'd8) ?\
  \ 8'd8 :\n                             unit_pressure_iters;\n                pressure_val\
  \ = self_in;\n                for (iter = 0; iter < iter_limit; iter = iter + 1)\
  \ begin\n                    delta_val    = fp_sub(avg_nbrs, pressure_val);\n  \
  \                  pressure_val = fp_add(pressure_val, fp_mul_const(delta_val, gain_sel));\n\
  \                end\n                alu_res = pressure_val;\n            end\n\
  \            `OP_BACKPROP: begin\n                reg [DATA_W-1:0] lr_sel;\n   \
  \             reg [DATA_W-1:0] neigh_sel;\n                reg [DATA_W-1:0] decay_sel;\n\
  \                reg [DATA_W-1:0] err;\n                reg [DATA_W-1:0] grad_term;\n\
  \                reg [DATA_W-1:0] neigh_term;\n                reg [DATA_W-1:0]\
  \ decay_term;\n                reg [DATA_W-1:0] update_term;\n                lr_sel\
  \    = (unit_backprop_lr    != {DATA_W{1'b0}}) ? unit_backprop_lr    : constA;\n\
  \                neigh_sel = (unit_backprop_neigh != {DATA_W{1'b0}}) ? unit_backprop_neigh\
  \ : constC;\n                decay_sel = (unit_backprop_decay != {DATA_W{1'b0}})\
  \ ? unit_backprop_decay : constD;\n                err        = fp_sub(constB, self_in);\n\
  \                grad_term  = fp_mul_const(err, lr_sel);\n                neigh_term\
  \ = fp_mul_const(avg_nbrs, neigh_sel);\n                decay_term = fp_mul_const(self_in,\
  \ decay_sel);\n                update_term = fp_sub(fp_add(grad_term, neigh_term),\
  \ decay_term);\n                alu_res     = fp_add(self_in, update_term);\n  \
  \          end\n            `OP_MICRO:      alu_res = micro_val;\n            `OP_LAPLACIAN:\
  \  alu_res = laplacian;\n            `OP_SHARPEN: begin\n                reg [DATA_W-1:0]\
  \ lap_gain;\n                reg [DATA_W-1:0] sharpen_val;\n                lap_gain\
  \    = fp_mul_const(laplacian, constA);\n                sharpen_val = fp_sub(self_in,\
  \ lap_gain);\n                alu_res     = sharpen_val;\n            end\n    \
  \        `OP_EDGE: begin\n                reg [DATA_W-1:0] edge_mag;\n         \
  \       edge_mag = fp_add(dx_abs, dy_abs);\n                alu_res  = edge_mag;\n\
  \            end\n            `OP_MIX: begin\n                reg [DATA_W-1:0] mix_self;\n\
  \                reg [DATA_W-1:0] mix_avg;\n                reg [DATA_W-1:0] mix_sum;\n\
  \                reg [DATA_W-1:0] acc;\n                mix_self = fp_mul_const(self_in,\
  \ constA);\n                mix_avg  = fp_mul_const(avg_nbrs, constB);\n       \
  \         mix_sum  = fp_mul_const(sum_with_vert, constC);\n                acc \
  \     = fp_add(fp_add(mix_self, mix_avg), fp_add(mix_sum, constD));\n          \
  \      alu_res  = acc;\n            end\n            default:        alu_res = self_in;\n\
  \        endcase\n    end\n\n    always @(posedge clk) begin\n        if (rst) next_out\
  \ <= {DATA_W{1'b0}};\n        else     next_out <= alu_res;\n    end\n\nendmodule\n"
