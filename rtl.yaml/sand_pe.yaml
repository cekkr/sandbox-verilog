behaviour:
  overview: 'sand_pe implements the per-cell update for the sandbox grid. It supports
    a

    mix of diffusion, laplacian, min/max, sharpening, backpropagation and

    programmable look-up transformations. Flux and pressure modes consume the

    enhanced unit tuple so the streaming raster engine and the legacy fully

    parallel fabric share identical semantics.

    '
  opcodes:
  - opcode: OP_NOP
    summary: Pass-through of self_in.
  - opcode: OP_DIFFUSE
    summary: Average of planar (optionally diagonal) neighbours.
  - opcode: OP_LAPLACIAN
    summary: Computes laplacian across planar neighbourhood.
  - opcode: OP_FLUX
    summary: Flux transfer based on unit tuple thresholds and weights.
  - opcode: OP_MICRO_LUT
    summary: Indexes micro_lut using opcode[1:0] & self_in[1:0].
  reset: 'Synchronous reset zeros pipeline registers and clears buffered accumulators

    before issuing the next_out result.

    '
notes: "- Toggle use_diagonals to include the four diagonal planar inputs in diffusion\n\
  \  style operations.\n- unit_flux_enable gates the enhanced tuple logic; when low\
  \ the module falls\n  back to constA..D driven arithmetic for compatibility with\
  \ older sandboxes.\n- The micro_lut fanout expects host software to seed 16 entries\
  \ of DATA_W bits.\n- For backpropagation opcodes, unit_backprop_* inputs define\
  \ the learning rate,\n  neighbour weight and decay applied during the update.\n"
