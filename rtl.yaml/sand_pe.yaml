  \ assign nb8[5]=nw_in; assign nb8[6]=se_in; assign nb8[7]=sw_in;\n\n    wire diag_active\
  \ = use_diagonals ||\n                       (unit_pressure_diag_override && (opcode\
  \ == `OP_PRESSURE));\n\n    integer i;\n    always @* begin\n        sum_nbrs =\
  \ { (DATA_W+4){1'b0} };\n        sum4_only = {(DATA_W+3){1'b0}};\n        min_nbr\
  \  = { DATA_W{1'b1} }; // max value\n        max_nbr  = { DATA_W{1'b0} };\n\n  \
  \      for (i=0;i<4;i=i+1) begin\n            sum4_only = sum4_only + nb4[i];\n\
  \            if (nb4[i] < min_nbr) min_nbr = nb4[i];\n            if (nb4[i] > max_nbr)\
