  \                if (nb8[i] < min_nbr) min_nbr = nb8[i];\n                if (nb8[i]\
  \ > max_nbr) max_nbr = nb8[i];\n            end\n            avg_nbrs = sum_nbrs[DATA_W-1:0]\
  \ >> 3; // /8\n        end\n\n        if (above_in < min_nbr) min_nbr = above_in;\n\
