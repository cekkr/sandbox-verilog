version: 1
kind: sand_module
module: sand_scheduler_dynamic
original_path: sand_scheduler_dynamic.v
includes:
- sand_defs.vh
tags:
- scheduler
- control
interface:
  parameters:
  - name: DATA_W
    default: '16'
    signed: false
  - name: WIDTH
    default: '32'
    signed: false
  - name: HEIGHT
    default: '32'
    signed: false
  - name: DEPTH
    default: '4'
    signed: false
  - name: N_JOBS
    default: '4'
    signed: false
  ports:
  - name: clk
    direction: input
    datatype: wire
    signed: false
  - name: rst
    direction: input
    datatype: wire
    signed: false
  - name: csr_we
    direction: input
    datatype: wire
    signed: false
  - name: csr_addr
    direction: input
    datatype: wire
    width: '[7:0]'
    signed: false
  - name: csr_wdata
    direction: input
    datatype: wire
    width: '[31:0]'
    signed: false
  - name: csr_re
    direction: input
    datatype: wire
    signed: false
  - name: csr_rdata
    direction: output
    datatype: reg
    width: '[31:0]'
    signed: false
  - name: seed_we
    direction: input
    datatype: wire
    signed: false
  - name: seed_job
    direction: input
    datatype: wire
    width: '[((N_JOBS>1)?$clog2(N_JOBS):1)-1:0]'
    signed: false
  - name: seed_layer
    direction: input
    datatype: wire
    width: '[((DEPTH>1)?$clog2(DEPTH):1)-1:0]'
    signed: false
  - name: seed_idx
    direction: input
    datatype: wire
    width: '[((WIDTH*HEIGHT>1)?$clog2((WIDTH*HEIGHT)):1)-1:0]'
    signed: false
  - name: seed_data
    direction: input
    datatype: wire
    width: '[DATA_W-1:0]'
    signed: false
  - name: job_done
    direction: output
    datatype: reg
    width: '[N_JOBS-1:0]'
    signed: false
behaviour:
  overview: Adaptive scheduler that time-slices jobs using telemetry-driven budgets
    and window selections.
  notes:
  - Monitors frame activity/cycle counters to expand or shrink per-job work.
  - Streams unit configuration and window parameters to the raster engine.
implementation:
  machine_path: machine/sand_scheduler_dynamic.yaml
  kind: verilog_module_fallback
