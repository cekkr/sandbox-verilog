  \  unit_weight_bottom <= csr_wdata[DATA_W-1:0];\n                    `CSR_UNIT_FLUX_WEIGHT_SIDE:\
  \    unit_weight_side   <= csr_wdata[DATA_W-1:0];\n                    `CSR_UNIT_FLUX_WEIGHT_RETAIN:\
  \  unit_weight_retain <= csr_wdata[DATA_W-1:0];\n                    `CSR_UNIT_FLUX_WEIGHT_PREV:\
  \    unit_weight_prev   <= csr_wdata[DATA_W-1:0];\n                    `CSR_UNIT_FLUX_THRESHOLD:\
  \      unit_flux_threshold     <= csr_wdata[DATA_W-1:0];\n                    `CSR_UNIT_FLUX_REVERSE_TOP:\
  \    unit_flux_reverse_top   <= csr_wdata[DATA_W-1:0];\n                    `CSR_UNIT_FLUX_REVERSE_BOTTOM:\
  \ unit_flux_reverse_bottom<= csr_wdata[DATA_W-1:0];\n                    `CSR_UNIT_PRESSURE_GAIN:\
  \       unit_pressure_gain  <= csr_wdata[DATA_W-1:0];\n                    `CSR_UNIT_BACKPROP_LR:\
  \         unit_backprop_lr     <= csr_wdata[DATA_W-1:0];\n                    `CSR_UNIT_BACKPROP_NEIGH:\
  \      unit_backprop_neigh  <= csr_wdata[DATA_W-1:0];\n                    `CSR_UNIT_BACKPROP_DECAY:\
  \      unit_backprop_decay  <= csr_wdata[DATA_W-1:0];\n                    default:\
  \ begin\n                        if (csr_addr >= `CSR_MICRO_BASE && csr_addr < (`CSR_MICRO_BASE+16))\
  \ begin\n                            micro_lut[csr_addr-`CSR_MICRO_BASE] <= csr_wdata[DATA_W-1:0];\n\
  \                            micro_lut_wr_stb  <= 1'b1;\n                      \
  \      micro_lut_wr_idx  <= csr_addr-`CSR_MICRO_BASE;\n                        \
  \    micro_lut_wr_data <= csr_wdata[DATA_W-1:0];\n                        end\n\
  \                    end\n                endcase\n            end\n\n         \
  \   // ---------------- Scheduler FSM ---------------------------------\n      \
  \      case (st)\n                S_IDLE: begin\n                    cur_budget\
  \    <= step_budget[cur_job];\n                    eng_job_sel   <= cur_job;\n \
  \                   eng_layer_sel <= cur_layer;\n                    eng_plane_sel\
  \ <= plane_sel[cur_job][cur_layer];\n                    win_width_sel  <= unit_window_width[cur_job];\n\
  \                    win_height_sel <= unit_window_height[cur_job];\n          \
  \          win_xoff_sel   <= unit_window_xoff[cur_job];\n                    win_yoff_sel\
  \   <= unit_window_yoff[cur_job];\n                    start_frame   <= 1'b1;\n\
  \                    st            <= S_WAIT;\n                end\n\n         \
  \       S_WAIT: begin\n                    if (eng_done) begin\n               \
  \         reg plane_next;\n                        reg [7:0] budget_curr;\n    \
  \                    reg [7:0] budget_next;\n                        reg [7:0] min_step;\n\
  \                        reg [7:0] max_step;\n                        reg [7:0]\
  \ manual_step;\n                        reg [31:0] act_lo;\n                   \
  \     reg [31:0] act_hi;\n                        reg [7:0] step_cnt_inc;\n\n  \
  \                      plane_next = plane_sel[cur_job][cur_layer] ^ 1'b1;\n    \
  \                    plane_sel[cur_job][cur_layer] <= plane_next;\n\n          \
  \              last_activity[cur_job] <= eng_activity;\n                       \
  \ last_cycles[cur_job]   <= eng_cycles;\n\n                        budget_curr =\
  \ step_budget[cur_job];\n                        min_step    <= adapt_min_steps;\n\
  \                        max_step    <= adapt_max_steps;\n                     \
  \   manual_step <= adapt_manual_steps;\n                        if (min_step < 1)\
  \ min_step = 1;\n                        if (max_step < min_step) max_step = min_step;\n\
  \                        if (max_step > step_max_u8) max_step = step_max_u8;\n \
  \                       if (manual_step < 1) manual_step = 8'd1;\n             \
  \           if (manual_step > step_max_u8) manual_step = step_max_u8;\n        \
  \                act_lo      = adapt_thresh_lo;\n                        act_hi\
  \      = (adapt_thresh_hi < adapt_thresh_lo) ? adapt_thresh_lo : adapt_thresh_hi;\n\
  \n                        if (!adapt_enable) begin\n                           \
  \ budget_next = step_max_u8;\n                        end else if (!adapt_auto)\
  \ begin\n                            budget_next = manual_step;\n              \
  \          end else begin\n                            budget_next = budget_curr;\n\
  \                            if (adapt_cycle_limit != 32'd0 && eng_cycles > adapt_cycle_limit\
  \ && budget_next > min_step)\n                                budget_next = budget_next\
  \ - 1'b1;\n                            else begin\n                            \
  \    if (eng_activity > act_hi && budget_next < max_step)\n                    \
  \                budget_next = budget_next + 1'b1;\n                           \
  \     else if (eng_activity < act_lo && budget_next > min_step)\n              \
  \                      budget_next = budget_next - 1'b1;\n                     \
  \       end\n                            if (adapt_use_heavy && heavy_opcode &&\
  \ budget_next > min_step)\n                                budget_next = budget_next\
  \ - 1'b1;\n                        end\n\n                        if (budget_next\
  \ < 8'd1) budget_next = 8'd1;\n                        if (budget_next > step_max_u8)\
  \ budget_next = step_max_u8;\n\n                        step_budget[cur_job] <=\
  \ budget_next;\n                        cur_budget           <= budget_next;\n\n\
  \                        step_cnt_inc = step_cnt + 1'b1;\n\n                   \
  \     if (step_cnt_inc < budget_next) begin\n                            step_cnt\
  \ <= step_cnt_inc;\n                            st       <= S_IDLE;\n          \
  \              end else begin\n                            step_cnt <= 8'd0;\n \
  \                           if (cur_layer == (DEPTH-1)) begin\n                \
  \                job_done[cur_job] <= 1'b1;\n                                cur_layer\
  \ <= {LAYER_W{1'b0}};\n                                cur_job   <= next_job;\n\
  \                                st        <= S_NEXTJ;\n                       \
  \     end else begin\n                                cur_layer <= cur_layer + {{(LAYER_W-1){1'b0}},1'b1};\n\
  \                                st        <= S_NEXTL;\n                       \
  \     end\n                        end\n                    end\n              \
  \  end\n\n                S_NEXTL: begin\n                    st <= S_IDLE;\n  \
  \              end\n\n                S_NEXTJ: begin\n                    st <=\
  \ S_IDLE;\n                end\n            endcase\n        end\n    end\n\n  \
  \  // Engine busy indicator (includes scheduler waiting)\n    wire engine_active\
  \ = (st != S_IDLE) || eng_busy;\n\n    // -------------------------------------------------------------------------\n\
  \    // CSR read mux\n    // -------------------------------------------------------------------------\n\
  \    wire [JOB_W-1:0] status_idx = ($unsigned(status_job_sel) < N_JOBS) ? status_job_sel\
  \ : {JOB_W{1'b0}};\n    wire [7:0] status_budget = step_budget[status_idx];\n  \
  \  wire [31:0] status_activity = last_activity[status_idx];\n    wire [31:0] status_cycles\
  \   = last_cycles[status_idx];\n\n    always @* begin\n        csr_rdata = 32'h0;\n\
  \        if (csr_re) begin\n            case (csr_addr)\n                `CSR_STATUS:\
  \ begin\n                    csr_rdata = { {(32-N_JOBS-1){1'b0}}, job_done, engine_active\
  \ };\n                end\n                `CSR_ADAPT_STATUS: begin\n          \
  \          csr_rdata = { status_cycles[15:0], status_activity[15:0] };\n       \
  \         end\n                `CSR_ADAPT_BUDGET: begin\n                    csr_rdata\
  \ = { adapt_max_steps, adapt_min_steps, status_budget, adapt_manual_steps };\n \
  \               end\n                `CSR_UNIT_CTRL: begin\n                   \
  \ csr_rdata = { 16'd0,\n                                  unit_pressure_iters,\n\
  \                                  4'd0,\n                                  unit_pressure_diag_override,\n\
  \                                  unit_overflow_reverse_bottom,\n             \
  \                     unit_overflow_reverse_top,\n                             \
  \     unit_flux_enable };\n                end\n                `CSR_UNIT_STATUS_WINDOW:\
  \ begin\n                    csr_rdata = { unit_window_height[status_idx], unit_window_width[status_idx]\
  \ };\n                end\n                `CSR_UNIT_STATUS_OFFSET: begin\n    \
  \                csr_rdata = { unit_window_yoff[status_idx], unit_window_xoff[status_idx]\
  \ };\n                end\n                `CSR_UNIT_FLUX_WEIGHT_TOP: begin\n  \
  \                  csr_rdata = {{(32-DATA_W){1'b0}}, unit_weight_top};\n       \
  \         end\n                `CSR_UNIT_FLUX_WEIGHT_BOTTOM: begin\n           \
  \         csr_rdata = {{(32-DATA_W){1'b0}}, unit_weight_bottom};\n             \
  \   end\n                `CSR_UNIT_FLUX_WEIGHT_SIDE: begin\n                   \
  \ csr_rdata = {{(32-DATA_W){1'b0}}, unit_weight_side};\n                end\n  \
  \              `CSR_UNIT_FLUX_WEIGHT_RETAIN: begin\n                    csr_rdata\
  \ = {{(32-DATA_W){1'b0}}, unit_weight_retain};\n                end\n          \
  \      `CSR_UNIT_FLUX_WEIGHT_PREV: begin\n                    csr_rdata = {{(32-DATA_W){1'b0}},\
  \ unit_weight_prev};\n                end\n                `CSR_UNIT_FLUX_THRESHOLD:\
  \ begin\n                    csr_rdata = {{(32-DATA_W){1'b0}}, unit_flux_threshold};\n\
  \                end\n                `CSR_UNIT_FLUX_REVERSE_TOP: begin\n      \
  \              csr_rdata = {{(32-DATA_W){1'b0}}, unit_flux_reverse_top};\n     \
  \           end\n                `CSR_UNIT_FLUX_REVERSE_BOTTOM: begin\n        \
  \            csr_rdata = {{(32-DATA_W){1'b0}}, unit_flux_reverse_bottom};\n    \
  \            end\n                `CSR_UNIT_PRESSURE_GAIN: begin\n             \
  \       csr_rdata = {{(32-DATA_W){1'b0}}, unit_pressure_gain};\n               \
  \ end\n                `CSR_UNIT_BACKPROP_LR: begin\n                    csr_rdata\
  \ = {{(32-DATA_W){1'b0}}, unit_backprop_lr};\n                end\n            \
  \    `CSR_UNIT_BACKPROP_NEIGH: begin\n                    csr_rdata = {{(32-DATA_W){1'b0}},\
  \ unit_backprop_neigh};\n                end\n                `CSR_UNIT_BACKPROP_DECAY:\
  \ begin\n                    csr_rdata = {{(32-DATA_W){1'b0}}, unit_backprop_decay};\n\
  \                end\n                default: csr_rdata = 32'h0;\n            endcase\n\
  \        end\n    end\nendmodule\n"
