- name: jm_plane_sel_i
  kind: wire
- name: jm_write_other_plane_i
  kind: wire
- name: jm_idx_i
  kind: wire
  width: '[CELL_W-1:0]'
- name: jm_wdata_i
  kind: wire
  width: '[DATA_W-1:0]'
- name: jm_rdata_i
  kind: wire
  width: '[DATA_W-1:0]'
- name: st
  kind: reg
  width: '[2:0]'
- name: cur_job
  kind: reg
  width: '[JOB_W-1:0]'
- name: cur_layer
  kind: reg
  width: '[LAYER_W-1:0]'
- name: cur_budget
  kind: reg
  width: '[7:0]'
- name: step_cnt
  kind: reg
  width: '[7:0]'
- name: heavy_opcode
  kind: wire
- name: engine_active
  kind: wire
- name: next_job
  kind: wire
  width: '[JOB_W-1:0]'
- name: step_max_u8
  kind: wire
  width: '[7:0]'
- name: clamp_steps
  kind: function
- name: j
  kind: integer
- name: l
  kind: integer
- name: adapt_min_clamped
  kind: reg
  width: '[7:0]'
- name: adapt_max_clamped
  kind: reg
  width: '[7:0]'
- name: manual_clamped
  kind: reg
  width: '[7:0]'
- name: status_idx
  kind: wire
  width: '[JOB_W-1:0]'
- name: status_budget
  kind: wire
  width: '[7:0]'
- name: status_activity
  kind: wire
  width: '[31:0]'
- name: status_cycles
  kind: wire
  width: '[31:0]'
always_blocks:
- on:
  - posedge clk
  type: sequential
  body:
  - if: rst
    then:
    - "// Reset all configuration registers, adaptive knobs, window tables, budgets, and plane selects."
    - "// Load defaults from sand_defs.vh macros and clear telemetry mirrors."
    - st <= S_IDLE;
    - cur_job <= {JOB_W{1'b0}};
    - cur_layer <= {LAYER_W{1'b0}};
    - cur_budget <= clamp_steps(`STEPS_PER_SLICE);
    - step_cnt <= 8'd0;
    - start_frame <= 1'b0;
    - job_done <= {N_JOBS{1'b0}};
    - eng_job_sel <= {JOB_W{1'b0}};
    - eng_layer_sel <= {LAYER_W{1'b0}};
    - eng_plane_sel <= 1'b0;
    - win_width_sel <= WIDTH[15:0];
    - win_height_sel <= HEIGHT[15:0];
    - win_xoff_sel <= 16'd0;
    - win_yoff_sel <= 16'd0;
  - else:
    - start_frame <= 1'b0;
    - micro_lut_wr_stb <= 1'b0;
    - if: csr_we
      then:
      - "// CSR writes update opcode/const tuple, adaptive knobs, window tables, unit controls, and micro LUT shadow."
      - "// Writes to CSR_STATUS clear job_done bits; CSR_ADAPT_CTRL clamps incoming step counts."
    - if: micro_lut_wr_stb
      then:
      - micro_lut[micro_lut_wr_idx] <= micro_lut_wr_data;
    - "// Mirror engine telemetry for adaptive policy."
    - if: eng_done
      then:
      - last_activity[eng_job_sel] <= eng_activity;
      - last_cycles[eng_job_sel] <= eng_cycles;
    - case: st
      branches:
        S_IDLE:
        - if: 'adapt_enable && !eng_busy'
          then:
          - "// Pick next job/layer pair, set frame window, compute budget, and kick engine."
          - start_frame <= 1'b1;
          - st <= S_WAIT;
        - else:
          - "// Idle until host or adaptive control requests a frame."
        S_WAIT:
        - if: eng_done
          then:
          - "// Update step counters and either advance layer/job pointers or mark job_done."
          - st <= S_NEXTL;
        - else:
          - st <= S_WAIT;
        S_NEXTL:
        - st <= S_IDLE;
        S_NEXTJ:
        - st <= S_IDLE;
- on:
  - '*'
  type: combinational
  body:
  - csr_rdata = 32'h0;
  - if: csr_re
    then:
    - case: csr_addr
      branches:
        '`CSR_STATUS`':
        - csr_rdata = { {(32-N_JOBS-1){1'b0}}, job_done, engine_active };
        '`CSR_ADAPT_STATUS`':
        - csr_rdata = { status_cycles[15:0], status_activity[15:0] };
        '`CSR_ADAPT_BUDGET`':
        - csr_rdata = { adapt_max_steps, adapt_min_steps, status_budget, adapt_manual_steps };
        '`CSR_UNIT_CTRL`':
        - csr_rdata = { 16'd0,
                        unit_pressure_iters,
                        4'd0,
                        unit_pressure_diag_override,
                        unit_overflow_reverse_bottom,
                        unit_overflow_reverse_top,
                        unit_flux_enable };
        '`CSR_UNIT_STATUS_WINDOW`':
        - csr_rdata = { unit_window_height[status_idx], unit_window_width[status_idx] };
        '`CSR_UNIT_STATUS_OFFSET`':
        - csr_rdata = { unit_window_yoff[status_idx], unit_window_xoff[status_idx] };
        '`CSR_UNIT_FLUX_WEIGHT_TOP`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_weight_top};
        '`CSR_UNIT_FLUX_WEIGHT_BOTTOM`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_weight_bottom};
        '`CSR_UNIT_FLUX_WEIGHT_SIDE`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_weight_side};
        '`CSR_UNIT_FLUX_WEIGHT_RETAIN`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_weight_retain};
        '`CSR_UNIT_FLUX_WEIGHT_PREV`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_weight_prev};
        '`CSR_UNIT_FLUX_THRESHOLD`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_flux_threshold};
        '`CSR_UNIT_FLUX_REVERSE_TOP`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_flux_reverse_top};
        '`CSR_UNIT_FLUX_REVERSE_BOTTOM`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_flux_reverse_bottom};
        '`CSR_UNIT_PRESSURE_GAIN`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_pressure_gain};
        '`CSR_UNIT_BACKPROP_LR`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_backprop_lr};
        '`CSR_UNIT_BACKPROP_NEIGH`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_backprop_neigh};
        '`CSR_UNIT_BACKPROP_DECAY`':
        - csr_rdata = {{(32-DATA_W){1'b0}}, unit_backprop_decay};
        default:
        - csr_rdata = 32'h0;
instances:
- module: sand_jobmem2p
  instance: u_mem
  parameters:
    DATA_W: DATA_W
    WIDTH: WIDTH
    HEIGHT: HEIGHT
    DEPTH: DEPTH
    N_JOBS: N_JOBS
  connections:
    clk: clk
    seed_we: seed_we
    seed_job: seed_job
    seed_layer: seed_layer
    seed_plane: "1'b0"
    seed_idx: seed_idx
    seed_data: seed_data
    eng_we: jm_we_i
    eng_job: jm_job_i
    eng_layer: jm_layer_i
    eng_plane_sel: jm_plane_sel_i
    eng_write_other_plane: jm_write_other_plane_i
    eng_idx: jm_idx_i
    eng_wdata: jm_wdata_i
    eng_rdata: jm_rdata_i
