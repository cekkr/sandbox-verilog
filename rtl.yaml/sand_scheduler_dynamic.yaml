version: 1
kind: sand_module
module: sand_scheduler_dynamic
original_path: sand_scheduler_dynamic.v
includes:
- sand_defs.vh
interface:
  parameters:
  - name: DATA_W
    default: '`DATA_W'
    note: Data width for cell state words.
  - name: WIDTH
    default: '`WIDTH'
    note: Grid width in cells.
  - name: HEIGHT
    default: '`HEIGHT'
    note: Grid height in cells.
  - name: DEPTH
    default: '`DEPTH'
    note: Number of layers per job.
  - name: N_JOBS
    default: '`N_JOBS'
    note: Concurrent job slots.
  ports:
    clk:
      direction: input
      datatype: wire
    rst:
      direction: input
      datatype: wire
    csr_we:
      direction: input
      datatype: wire
      note: Strobes a CSR write transaction.
    csr_addr:
      direction: input
      width: '[7:0]'
      datatype: wire
    csr_wdata:
      direction: input
      width: '[31:0]'
      datatype: wire
    csr_re:
      direction: input
      datatype: wire
    csr_rdata:
      direction: output
      width: '[31:0]'
      type: reg
      note: CSR read bus multiplexer output.
    seed_we:
      direction: input
      datatype: wire
      note: Host writes initial grid contents into plane 0.
    seed_job:
      direction: input
      width: '[((N_JOBS>1)?$clog2(N_JOBS):1)-1:0]'
      datatype: wire
    seed_layer:
      direction: input
      width: '[((DEPTH>1)?$clog2(DEPTH):1)-1:0]'
      datatype: wire
    seed_idx:
      direction: input
      width: '[((WIDTH*HEIGHT>1)?$clog2((WIDTH*HEIGHT)):1)-1:0]'
      datatype: wire
    seed_data:
      direction: input
      width: '[DATA_W-1:0]'
      datatype: wire
    job_done:
      direction: output
      width: '[N_JOBS-1:0]'
      type: reg
      note: Per-job completion flags, cleared when CSR_STATUS is written.
constants:
- name: CELLS
  value: WIDTH*HEIGHT
- name: JOB_W
  value: '(N_JOBS > 1) ? $clog2(N_JOBS) : 1'
- name: LAYER_W
  value: '(DEPTH > 1) ? $clog2(DEPTH) : 1'
- name: CELL_W
  value: '(CELLS > 1) ? $clog2(CELLS) : 1'
- name: STEP_MAX
  value: '(`STEPS_PER_SLICE > 0) ? `STEPS_PER_SLICE : 1'
- name: S_IDLE
  value: 3'd0
- name: S_WAIT
  value: 3'd1
- name: S_NEXTJ
  value: 3'd2
- name: S_NEXTL
  value: 3'd3
signals:
- name: opcode
  kind: reg
  width: '[`OPCODE_W-1:0]'
- name: constA
  kind: reg
  width: '[DATA_W-1:0]'
- name: constB
  kind: reg
  width: '[DATA_W-1:0]'
- name: constC
  kind: reg
