version: 1
kind: sand_module
module: sand_top
original_path: sand_top.v
includes:
- sand_defs.vh
tags:
- integration
- csr
interface:
  ports:
  - name: clk
    direction: input
    datatype: wire
    signed: false
  - name: rst
    direction: input
    datatype: wire
    signed: false
  - name: csr_we
    direction: input
    datatype: wire
    signed: false
  - name: csr_re
    direction: input
    datatype: wire
    signed: false
  - name: csr_addr
    direction: input
    datatype: wire
    width: '[7:0]'
    signed: false
  - name: csr_wdata
    direction: input
    datatype: wire
    width: '[31:0]'
    signed: false
  - name: csr_rdata
    direction: output
    datatype: wire
    width: '[31:0]'
    signed: false
  - name: seed_we
    direction: input
    datatype: wire
    signed: false
  - name: seed_job
    direction: input
    datatype: wire
    width: '[$clog2(4)-1:0]'
    signed: false
  - name: seed_layer
    direction: input
    datatype: wire
    width: '[$clog2(4)-1:0]'
    signed: false
  - name: seed_idx
    direction: input
    datatype: wire
    width: '[$clog2((32*32))-1:0]'
    signed: false
  - name: seed_data
    direction: input
    datatype: wire
    width: '[16-1:0]'
    signed: false
  - name: job_done
    direction: output
    datatype: wire
    width: '[4-1:0]'
    signed: false
behaviour:
  overview: SoC-facing top-level that wires the CSR bus, scheduler, raster engine,
    and job memory together.
  notes:
  - Hosts seeding and CSR access, exporting job_done/status telemetry for firmware.
  - Clock/reset domain wrapper for the sand processing fabric.
implementation:
  machine_path: machine/sand_top.v
  kind: verilog_module
